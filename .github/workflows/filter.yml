name: tg-keyword-filter
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install telethon

      - name: Run filter
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELETHON_SESSION: ${{ secrets.TELETHON_SESSION }}
          SOURCE_BOT: ${{ secrets.SOURCE_BOT }}
          KEYWORD: ${{ secrets.KEYWORD }}
        run: python bot.py

      - name: Commit state
        run: |
          git config user.name "tg-filter"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          git push
